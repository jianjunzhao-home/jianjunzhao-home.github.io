# Personal settings for the unmodified Academic Pages theme.
# Theme source: https://github.com/academicpages/academicpages.github.io
# Replace the upstream _config.yml with this file.
locale: "en-US"
site_theme: "default"
title: "Jianjun Zhao"
title_separator: "-"
name: &name "Jianjun Zhao"
description: &description "Academic homepage of Jianjun Zhao, Professor at Kyushu University"
url: "https://jianjunzhao-home.github.io"
baseurl: ""
repository: "jianjunzhao-home/jianjunzhao-home.github.io"

author:
  avatar: "avatar-placeholder.svg" # Temporary initials; replace with a personal profile photo after uploading it to images/
  name: "Jianjun Zhao"
  bio: "Professor of Software Engineering and Programming Languages, Kyushu University"
  location: "Fukuoka, Japan"
  employer: "Kyushu University"
  uri: "https://hyoka.ofc.kyushu-u.ac.jp/html/100021354_en.html"
  email: "zhao@ait.kyushu-u.ac.jp"
  github: "pangukaitian"
  googlescholar: # Fill in your verified Google Scholar URL later
  orcid: # Fill in your verified ORCID URL later

publication_category:
  books:
    title: 'Books'
  manuscripts:
    title: 'Journal Articles'
  conferences:
    title: 'Conference Papers'

teaser:
breadcrumbs: false
words_per_minute: 160
future: true
read_more: "disabled"
talkmap_link: false
comments:
  provider:
atom_feed:
  hide: true
  path:
google_site_verification:
bing_site_verification:
og_image:
og_description:
social:
  type: "Person"
  name: "Jianjun Zhao"
  links:
    - "https://github.com/pangukaitian"
analytics:
  provider: "false"

include:
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Dockerfile
  - Gemfile
  - LICENSE
  - local
  - node_modules
  - package.json
  - README.md
  - tmp
  - vendor

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true

sass:
  sass_dir: _sass
  style: compressed
permalink: /:categories/:title/
timezone: Asia/Tokyo
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]
  ignore:
    envs: development
